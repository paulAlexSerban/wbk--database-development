services:
  database:
    build: ./database/mysql-server
    container_name: ${COMPOSE_PROJECT_NAME}_mysql
#   volumes:
#     - ./database/mysql-server/src:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DATABASE_ROOT_PASSWORD}
      - MYSQL_USER=${DATABASE_USER}
      - MYSQL_PASSWORD=${DATABASE_PASSWORD}
      - MYSQL_DATABASE=${COMPOSE_PROJECT_NAME}
    restart: always

  php-service:
    container_name: ${COMPOSE_PROJECT_NAME}_php-service
    build: 
      context: ./backend/services/php-service
      dockerfile: Dockerfile
    depends_on: 
      - database
    volumes: 
      - ./backend/services/php-service/src:/var/www/html
    ports: 
      - 8081:80

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - 8080:80
    restart: always
    environment:
      PMA_HOST: database
    depends_on:
      - database